<!DOCTYPE html>
<html>

<head>
    <title>Student Management System</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 20px;
        }

        .container {
            width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
        }

        h2 {
            text-align: center;
        }

        input,
        select,
        button {
            padding: 8px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
        }

        .delete {
            background: red;
            color: rgba(255, 255, 255, 0.463);
            border: none;
            padding: 5px 10px;
        }

        .add {
            background: rgb(128, 0, 51);
            color: rgb(79, 43, 43);
            border: none;
        }

        .noRecord {
            text-align: center;
            color: rgb(132, 0, 255);
            margin-top: 20px;
            font-weight: bold;
        }

        .total {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        function App() {

            const [students, setStudents] = React.useState([
                { id: 1, name: "Rahul", branch: "CSE" },
                { id: 2, name: "Aman", branch: "IT" },
                { id: 3, name: "Priya", branch: "ECE" }
            ]);

            const [name, setName] = React.useState("");
            const [branch, setBranch] = React.useState("CSE");

            const [search, setSearch] = React.useState("");
            const [filter, setFilter] = React.useState("All");

            function addStudent() {

                if (name.trim() === "") {
                    alert("Enter Student Name");
                    return;
                }

                const newStudent = {
                    id: Date.now(),
                    name: name,
                    branch: branch
                };

                setStudents([...students, newStudent]);

                setName("");
                setBranch("CSE");
            }

            function deleteStudent(id) {
                setStudents(students.filter(student => student.id !== id));
            }

            const filteredStudents = students.filter(student => {

                const nameMatch = student.name.toLowerCase().includes(search.toLowerCase());

                const branchMatch =
                    filter === "All" || student.branch === filter;

                return nameMatch && branchMatch;

            });

            return (

                <div className="container">

                    <h2>Student Management System</h2>

                    <h3>Add Student</h3>

                    <input
                        type="text"
                        placeholder="Student Name"
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                    />

                    <select
                        value={branch}
                        onChange={(e) => setBranch(e.target.value)}
                    >
                        <option>CSE</option>
                        <option>IT</option>
                        <option>ECE</option>
                        <option>ME</option>
                    </select>

                    <button className="add" onClick={addStudent}>
                        Add Student
                    </button>

                    <hr />

                    <input
                        type="text"
                        placeholder="Search by Name"
                        value={search}
                        onChange={(e) => setSearch(e.target.value)}
                    />

                    <select
                        value={filter}
                        onChange={(e) => setFilter(e.target.value)}
                    >
                        <option>All</option>
                        <option>CSE</option>
                        <option>IT</option>
                        <option>ECE</option>
                        <option>ME</option>
                    </select>

                    <div className="total">
                        Total Students : {filteredStudents.length}
                    </div>

                    {
                        filteredStudents.length === 0 ?

                            <div className="noRecord">
                                No Record Found
                            </div>

                            :

                            <table>

                                <thead>

                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Branch</th>
                                        <th>Delete</th>
                                    </tr>

                                </thead>

                                <tbody>

                                    {
                                        filteredStudents.map(student => (

                                            <tr key={student.id}>

                                                <td>{student.id}</td>
                                                <td>{student.name}</td>
                                                <td>{student.branch}</td>

                                                <td>

                                                    <button
                                                        className="delete"
                                                        onClick={() => deleteStudent(student.id)}
                                                    >
                                                        Delete
                                                    </button>

                                                </td>

                                            </tr>

                                        ))
                                    }

                                </tbody>

                            </table>

                    }

                </div>

            );

        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>

</body>

</html>
